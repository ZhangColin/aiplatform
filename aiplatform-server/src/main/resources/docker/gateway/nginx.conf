# 平台预览网关（#128，dev profile）：一条通配 server 块把 *.localhost 子域路由到
# 对应工作区容器 ws-{id}:8081，零 per-app 配置、零 reload；resolver 指向 Docker 内置
# DNS（127.0.0.11），按容器名解析。HTML 响应经 sub_filter 注入平台标注脚本
# （annotation.js 网关自持，不进用户源码、不在容器内）。
#
# 生产同构：base 换 *.preview.{domain} + wildcard 证书（TLS 终止），路由/注入块不变。
# 部署与开发启动见 docs/guide/（预览网关）与 ADR-0014。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker 内置 DNS：网关按容器名 ws-{id} 解析到工作区容器 IP（同网 previewnet）
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        # 子域捕获 workspaceId（TSID 数值形）——{id}.localhost → ws-{id}:8081
        server_name ~^(?<wsid>[0-9]+)\.localhost$;

        # 标注脚本资产（平台产物，网关自持）：注入脚本引用的同源路径，不代理到用户容器
        location = /.aiplatform/annotation.js {
            alias /etc/nginx/annotation.js;
            default_type application/javascript;
        }

        # 注入标注脚本：sub_filter 在 HTML 里把 </head> 替换为「脚本引用 + </head>」。
        # Accept-Encoding 置空让上游回未压缩 HTML（gzip 会挡住 sub_filter 的字符串替换）。
        sub_filter_once on;
        sub_filter '</head>'
            '<script data-aiplatform="annotation" src="/.aiplatform/annotation.js"></script></head>';

        location / {
            set $upstream http://ws-$wsid:8081;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";
        }
    }
}
