# 本机开发环境：依赖启动方式见 docs/guide/本机依赖启动.md
# 平台 PG = 本服务独立实例（docker pgvector，5434；5432 是共享 aieducenter 库无 vector，5433 是冻结 demo）
spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/aiplatform
    username: aiplatform
    password: aiplatform-dev
  data:
    redis:
      host: localhost
      port: 6380

# #29 后台机机面：入站验签凭据走本机 app-registry（8088，启动与 seed 见
# docs/guide/本机依赖启动.md；apiKey = appCode，admin-console 为 seed 预置应用）
cartisan:
  openapi:
    apikey-service-url: http://localhost:8088/api/app-registry/api-keys/{apiKey}

spring.jpa.show-sql: true
