spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # #383：deploy/infra 的 redis 起栈即 requirepass（eu-1 现网迁移前无密码，迁移窗口
      # 随 infra 起栈生效）——密码无默认值，缺失与 REDIS_HOST 同口径 fail-fast
      #（启动解析即炸，不静默回落无密码连接）
      password: ${REDIS_PASSWORD}

spring.jpa.show-sql: false
logging.level.root: INFO

# 预览路由（#129 生产化，#386 起归共享 nginx）：预览 URL 换 https + 生产基域名
# {id}.preview.{domain}——平台 conf.d 配置（deploy/nginx/aiplatform.conf，TLS 终止 +
# wildcard 证书口径见 docs/guide/生产部署.md §6）。PREVIEW_BASE 部署时供给（无默认，
# 缺省启动即 fail-fast）。
app:
  embedding:
    url: ${EMBEDDING_URL}
  workspace:
    preview-scheme: https
    preview-base: ${PREVIEW_BASE}

# 生产 https：cookie 必须 Secure（A2 §2 表 8-②）；issuer/redirect-uri 随环境注册
sso:
  cookie-secure: true

# 机机验签凭据源（app-registry）：prod 缺省＝webnet 容器名直发（eu-1 定稿口径，容器
# 部署免配置；application.yml 缺省 localhost:8088 是本机开发口径，容器内必错）。
# 仅 app-registry 不在同一 docker 网/裸机形态才需 env 覆盖。
cartisan:
  openapi:
    apikey-service-url: ${APP_REGISTRY_BASE_URL:http://semgravio-app-registry:8088}/api/app-registry/api-keys/{apiKey}
