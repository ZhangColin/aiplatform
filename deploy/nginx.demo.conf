# 预览网关·单入口演示形态（ECS 部署）：一个容器、宿主只开 8080 一个口——
#   主站 semgravio.com[:8080] → aiplatform-web:3333（default_server 兜住 IP 直访）
#   主预览 {id}.preview.semgravio.com → ws-{id}:8081（沿用仓内 gateway-inject/gateway-proxy 块）
#   快照 snap-{viewId}.preview.semgravio.com → snap-{viewId}:8081（只逛不换，不注入）
# 与生产形态（nginx.prod.conf.template）的差别：无 TLS（未备案大陆机 80/443 域名访问被
# 拦、非标端口不拦，故域名也走 8080）、新增主站块。端口与后端 PREVIEW_BASE
# （preview.semgravio.com:8080）对齐。转正式的切换点见部署文档。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker 内置 DNS：web 容器重启换 IP 最迟 5s 重解析
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 主站：SSE（/api/events 经 next 透传）不扣流；上传对齐后端 12MB 上限放宽到 20m
    # default_server 保留 IP 直访兜底（http://<IP>:8080），域名解析生效前后都能用
    server {
        listen 80 default_server;
        server_name semgravio.com www.semgravio.com;
        client_max_body_size 20m;

        location / {
            set $upstream_web aiplatform-web;
            proxy_pass http://$upstream_web:3333;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }

    server {
        listen 80;
        server_name ~^(?<wsid>[0-9]+)\.preview\.semgravio\.com$;
        set $upstream_host ws-$wsid;

        include gateway-inject.conf;
        include gateway-proxy.conf;
    }

    server {
        listen 80;
        server_name ~^snap-(?<vid>[0-9]+)\.preview\.semgravio\.com$;
        set $upstream_host snap-$vid;

        include gateway-proxy.conf;
    }
}
