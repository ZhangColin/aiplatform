# 代理块（#128/#141 共享，#180 A 片扩）：location / 反代到 server 块派生的
# $upstream_host——子域捕获与「子域 label → 容器名/网络别名」变换归各 server 块
# （主预览 ws-{id}、快照 snap-{viewId} 别名），本块只管「怎么代理」（升级透传/
# 超时/头）与「代理失败的呈现」（上游不可达自恢复提示页），被各 profile 的
# server {} 块 include（见 nginx.conf / nginx.prod.conf.template）——主预览/快照/
# 两 profile 一并生效。resolver 在 http 层、由各配置文件各自声明，不在本块内。
#
# 上游不可达（#180 A 片）：代理失败族（502 连不上/DNS 解析失败、504 超时——均为
# nginx 自产错误码）内部重定向到网关自持的提示页，替代裸 502；error_page 不带
# 「=」保留原状态码（口径：状态码仍 5xx，页面只是换脸）。不开 proxy_intercept_
# errors：上游应用自己回的 4xx/5xx 原样透传——提示页只管「网关连不上上游」，
# 不覆盖应用自身错误。网关侧零唤醒逻辑（ADR-0016：访客经网关不触发）。
error_page 502 504 /.aiplatform/unavailable.html;

# 提示页资产（网关自持，同 annotation.js 先例）：internal——只经 error_page 内部
# 重定向可达，直访 404。Cache-Control no-store 须 always：add_header 默认只加在
# 2xx/3xx，5xx 状态码下会丢。
location = /.aiplatform/unavailable.html {
    internal;
    alias /etc/nginx/unavailable.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    # 覆写注入块的 sub_filter 为永不命中模式（array 型指令：本层声明即不继承
    # server 层清单）：提示页是平台页面、不是用户系统，不注入圈注脚本——nginx
    # 自产错误页与上游 HTML 一样过 text/html 过滤链，不覆写就会注入。
    # 快照 server 块不 include 注入块，此覆写对其无实义、仅为单源不劈叉。
    sub_filter '__aiplatform_error_page_never_matches__' '';
}

location / {
    set $upstream http://$upstream_host:8081;
    proxy_pass $upstream;
    # WebSocket 升级透传（next dev 的 /_next/hmr 等）：nginx 默认剥 hop-by-hop 头
    # （Upgrade/Connection）且以 HTTP/1.0 转发——升级头到不了上游，/_next/hmr 被
    # next 当页面路由 404，浏览器侧 WebSocket connection failed 无限重试。官方范式
    # 是 map 变量（http 块、各 profile 自声明）：仅客户端真带 Upgrade 才置
    # Connection: upgrade，普通请求不受扰。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 升级成功后是隧道长连接：放宽空闲读超时（默认 60s 会掐静默期稍长的 WS）
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 原客户端 scheme（dev http / prod https）：下游应用据此生成绝对 URL、判外部协议
    proxy_set_header X-Forwarded-Proto $scheme;
    # 上游回未压缩 HTML：注入块（gateway-inject.conf）的 sub_filter 依赖（gzip 挡
    # 字符串替换）；对不 include 注入块的快照路由无实害——统一代理行为，单源不劈叉
    proxy_set_header Accept-Encoding "";
}
