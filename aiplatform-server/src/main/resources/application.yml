server:
  port: 8888

spring:
  application:
    name: aiplatform-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: aiplatform-server_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    # #365 · 模型供应商通道种子 key 注入（ADR-0031：apiKey 落库唯一正本、git 永不
    # 含 key 字面——部署环境注入种子（V44 一次性 INSERT），本机 dev 直写库，后续换
    # key 走后台维护面（#367）；变量只在迁移执行时读一次，非运行期回落（缺失即空、
    # 装配明确报错）。ARK_API_KEY 是图片域名（image-generation），对话线独立成对。
    placeholders:
      volcengineApiKey: ${VOLCENGINE_API_KEY:}
      deepseekApiKey: ${DEEPSEEK_API_KEY:}
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  # 分页统一 1 基（ADR-0001：请求/响应均 1 基，默认 size=20）
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
  # multipart 上传（#286 物料上传，v1 唯一上传面）：业务上限 10MB 在应用层判
  # （PRJ_043 如实报错），容器层 12MB 是防大流量直灌的硬闸——越闸请求由
  # MultipartLimitEnvelopeAdvice 归一回同一业务码信封（Spring 缺省 1MB 会把
  # 合法上传拦在业务层之外，必须显式配）
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

# 机机调用签名（cartisan-openapi；与用户会话无关，ADR-0001）；
# 默认枚举 Controller 关闭（扫描包默认 com.cartisan/com.example，用不到，避免契约噪音）
cartisan:
  web:
    enum-controller:
      enabled: false
  openapi:
    # self = 出站调用自己的凭证（v1 无出站调用，壳留位）；键名对齐
    # CartisanOpenapiProperties.Self（api-key/api-secret）
    self:
      api-key: ${OPENAPI_APP_ID:}
      api-secret: ${OPENAPI_APP_SECRET:}
    # 入站验签的凭据源（app-registry）——按环境注入基址（同网内直发 app-registry，
    # 不经网关域名）；缺省 local 本机 bootstrap 端点
    apikey-service-url: ${APP_REGISTRY_BASE_URL:http://localhost:8088}/api/app-registry/api-keys/{apiKey}


# 片3 · base.knowledge：本机 fastembed embedding 服务（512 维），
# 启动方式见 docs/guide/本地开发启动.md（scripts/embedding_server.py）
app:
  embedding:
    url: http://127.0.0.1:9091
  # base.agentscope：智能体内核（AgentScope HarnessAgent）默认值。
  # 模型选用不在此（ADR-0031/#366：三座智能体与边缘四点〔取名/压缩/分类/预检〕
  # 的模型串＋通道注入一律走档位解析链——prj_model_providers/prj_model_tiers 两层
  # 落库、apiKey 库内唯一正本，装配链 ModelTierAppService 解析，后台改档即生效；
  # 旧 default-model/compaction-model 键已随边缘点收编退役）；workspace 是本地
  # 兜底工作区（命令未带 workspaceId 时用，留空 = AgentScope 默认）——命令带
  # workspaceId 则解析为项目 dev 工作区（docker exec 文件面）。
  agentscope:
    agent-name: platform-agent
    default-system-prompt: 你是平台智能体。
    timeout: 2m
    # 单 turn 迭代上限：内核缺省 10 会把编码 turn 掐断成 exceed_max_iters 假完成
    # （依据与取值见 AgentscopeProperties#maxIters 注释——单点事实在此不重述）。
    max-iters: 300
    # 压缩触发阈值（#108 / ADR-0012）：让压缩在 context_length_exceeded 前触发
    # （依据与取值见 AgentscopeProperties#compactionTriggerTokens 注释——单点事实
    # 在此不重述；压缩模型走边缘点档位链，不在此配）。
    compaction-trigger-tokens: 400000
    # 模型流断流自动重试（#321）：429/5xx 零发射失败流层接续、耗尽上抛外层尝试环；
    # 平台层独占（框架内建重试已在 resolve 时关闭）——取值与依据见
    # AgentscopeProperties#modelStreamRetryMaxAttempts 注释（单点事实在此不重述）。
    model-stream-retry-max-attempts: 3
    model-stream-retry-initial-backoff: 2s
    model-stream-retry-max-backoff: 30s
    # 单条模型流总时长上限（#322）：堵滴漏挂流（信号间隔小于内建超时、永不收口），
    # 超限按可重试失败进流层重试/外层尝试环；null/零/负可关——取值与依据见
    # AgentscopeProperties#modelStreamMaxDuration 注释（单点事实在此不重述）。
    model-stream-max-duration: 15m
    # #475 · 会话执行器分池（ADR-0042）：生成车道（产出轨整场任务——生成/迭代
    # 复演/设计轨）stripe 数＝跨项目并发上界，按单机容量调低（缺省 8＝共池时代
    # 容量平移）；超宽排队可见（入队/出队滞留日志）。交互车道出队滞留超阈值即
    # WARN——「排在队列里无痕迹」是 11-12 事故定位全靠 jstack 的根源。改动重启
    # 生效（常驻线程组，非运营配置热面）。
    generation-stripes: 8
    session-queue-warn-threshold: 5s
  # #63 · base.workspace：后台置备失败自动重试上界（含首次，即 N-1 次自动重试），
  # 达上限转 failed 待手动重试（POST /api/workspaces/{id}/retry）。
  # #171 · 闲置休眠（ADR-0016）：闲置阈值（last-touch 逾此即休眠，工作区与快照
  # 查看会话同一阈值）、扫描间隔（Duration 形如 5m，@Scheduled 消费）与开关
  # （test profile 关闭——集成测试直调扫描，定时器不扰测试库）。
  # #172 · 封存与深度唤醒：封存阈值（休眠满此即自动封存——整卷打包含库存平台
  # 本地磁盘后删卷）、封存包目录（生产应挂独立卷/盘；换对象存储时此配置退役、
  # 端口接口不动）与就绪等待超时（深度唤醒分钟级——解包＋依赖重装，3 分钟不够）。
  workspace:
    provision-max-attempts: 3
    # #476 · 置备线程池大小＝可并行置备数＝「同时冷启动无排队」并发数。默认 12＝
    # eu-1（8 vCPU/30G）单机标定上限：12 路并发置备 CPU/IO 尖峰无压力、12 项目
    # 随后全活跃（各 ~1.25G）RAM 仍在墙内；再往上批时长退化、全活跃踩 OOM——
    # 换机器再调，别在本机加数。常驻线程组，改动重启生效（非运营配置热面）。
    provision-threads: 12
    idle-threshold: 60m
    hibernation-scan-interval: 5m
    hibernation-enabled: true
    seal-threshold: 30d
    seal-archive-dir: seal-archives
    readiness-timeout: 10m
  # 片2-1 · business.project 生成编排：编码 run 尝试上界（含首试）与单次尝试的
  # 活超时判死阈值（#322——纯静默超限才判死，持续产出事件/工具动作的活跃段不掐；
  # 取代旧一次性 30m 总墙钟）。超限进重试/尝试环，重试耗尽转终态失败，用户
  # 「继续生成」断点续跑兜底（#221）。单条模型流总时长上限另配
  # app.agentscope.model-stream-max-duration。
  generation:
    max-attempts: 3
    silence-timeout: 10m
    # 工具执行窗的活超时预算（#355）：长命令（依赖安装/测试）执行中引擎无事件，
    # 给延长预算防静默阈值误杀；任何事件到达即回落 silence-timeout
    tool-silence-timeout: 30m
  # #371 · business.project 主智能体对话编排：对话轮活超时判死阈值——#322 生成轨
  # 口径接入对话轨（带增强工具〔fetch_url/web_search〕的慢轮不再被
  # app.agentscope.timeout 一次性总墙钟掐死，还在干活就不掐、纯静默超限才判死；
  # 问答作答复跑同阈值）。判定轮/取名/预检等无工具轻调用仍走总墙钟缺省。
  main-agent:
    silence-timeout: 2m
    # 工具执行窗预算（#355 同机制）：对话工具是网络 I/O 型（fetch_url 请求超时另配
    # app.external-content.request-timeout-seconds，缺省 45s），轻于生成轨构建命令
    # （30m）；任何事件到达即回落 silence-timeout
    tool-silence-timeout: 5m
  # #326 · business.identity 访客域：保留期缺省走配置（自最近活跃起算，逾此凭证
  # 不认、数据不删）与续期写节流窗口（距最近活跃达此值才写——读多写少，有效性
  # 窗口实际落在 [retention, retention + threshold]）。
  guest:
    retention-period: 30d
    renew-threshold: 15d
  # #329 · business.identity 登录会话持久化（idn_sessions）：会话 TTL（创建即定
  # now+ttl，过即不认、定时扫描清行）与清扫节奏（@Scheduled 占位符消费，DELETE
  # 幂等——多实例并发清扫安全）。
  session:
    ttl: 14d
    cleanup-interval: 1h
  # #213 · business.project 外部资料抓取：响应大小上限（字节，超此截断——缺省
  # 1 MiB）。纯 HTTP 只读 GET，四条安全底线见 HttpExternalContentFetcher。
  # #372 · 请求超时（秒——跨境慢源如 GitHub 实测 200 但 15s+，钉死 15s 必挂，
  # 放宽缺省 45；连接超时维持 5s）与出站代理（host:port；空＝直连，未配置时回落
  # HTTPS_PROXY/HTTP_PROXY 环境变量——本地开发走代理客户端出网、生产法兰克福
  # 直连）。SSRF 判定不因代理移除也不加严（前置建议性拦截，代理侧治理归代理）。
  external-content:
    max-bytes: 1048576
    request-timeout-seconds: 45
    proxy: ""
  # #215 · business.project 调研闭环搜索供数器：base-url + key——换供数方 = 加适配器
  # + 换配置，主链路零改动；key 只落环境变量 BOCHA_API_KEY（.env.local，gitignored），
  # 不进 git。缺省空 key 时搜索如实报错（按供应商类型选适配器的开关留待第二家接入）。
  web-search:
    base-url: https://api.bocha.cn
    api-key: ${BOCHA_API_KEY:}
  # #288 · business.project 出图工具件内核（ADR-0026/27）：图片生成供数方四家全接、
  # 按供应商选适配器（provider 键＝zhipu/volcano/openai/dashscope，词表与计量
  # UsageEvent.provider 同源）；空＝未配置（出图如实 PRJ_045，平台照常起）。key
  # 只落环境变量（.env.local，gitignored）不进 git；model 各家可换（计量随改走
  # 适配器自报）。技术失败有限自动重试（含首次，对偶 #63 置备重试上界）。
  image-generation:
    provider: ${IMAGE_GEN_PROVIDER:}
    max-attempts: 3
    zhipu:
      base-url: https://open.bigmodel.cn
      api-key: ${ZHIPU_API_KEY:}
      model: glm-image
    volcano:
      base-url: https://ark.cn-beijing.volces.com
      api-key: ${ARK_API_KEY:}
      model: doubao-seedream-5-0-260128
    openai:
      base-url: https://api.openai.com
      api-key: ${OPENAI_IMAGE_API_KEY:}
      model: gpt-image-2.5-sunburst
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen-image-3.0
  # #327 · business.identity 验证码登录（M01）：频控/有效期/试错上限全参数化（上线
  # 参数）；通道机制双开、上线先邮箱（手机开关位在，翻配置即开）。发送服务商＝上线
  # 参数——接口位在 VerificationCodeSender，#376 起 Resend 真发信落地（key 配了走
  # Resend、缺失/空回落日志桩，条件装配见 ResendApiKeyCondition）。
  verification-code:
    code-ttl-seconds: ${VERIFICATION_CODE_TTL_SECONDS:300}
    send-cooldown-seconds: ${VERIFICATION_CODE_COOLDOWN_SECONDS:60}
    max-verify-attempts: ${VERIFICATION_CODE_MAX_ATTEMPTS:5}
    email-channel-enabled: ${VERIFICATION_EMAIL_ENABLED:true}
    phone-channel-enabled: ${VERIFICATION_PHONE_ENABLED:false}
    # #375/#376 · Resend 发信（验证码真发信）：key 只落环境变量（.env.local /
    # .env.production 手工落值，gitignored）不进 git；MAIL_FROM 缺省品牌域 no-reply，
    # 发件人名「Semgravio」固定。不配 key＝回落日志桩（本地开发零配置）。
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${MAIL_FROM:no-reply@semgravio.com}

# A2 · business.identity：OIDC BFF 认证（sso.* 七项，照 identity demo SsoProperties）。
# 凭据只落本地环境变量（.env.local，gitignored），不进 git——见 docs/guide/本地开发启动.md。
# 全程 localhost、禁混 127.0.0.1（cookie 按域隔离不带端口，A2 §2 表 8）。
sso:
  issuer: ${SSO_ISSUER:http://identity.localhost:10001}
  client-id: ${SSO_CLIENT_ID:}
  client-secret: ${SSO_CLIENT_SECRET:}
  redirect-uri: ${SSO_REDIRECT_URI:http://localhost:3333/auth/callback}
  scope: ${SSO_SCOPE:openid profile email}
  app-base-url: ${SSO_APP_BASE_URL:http://localhost:3333}
  # local 走 http://localhost：Safari/Firefox 不豁免 Secure-over-http，拒存 Secure cookie
  # （A2 §2 表 8-②）；生产 https 必须 true（application-prod.yml 已翻）
  cookie-secure: ${SSO_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  health:
    # 平台自身不用 Redis（会话内存态，见 docs/guide/本地开发启动.md）——redis starter
    # 是 cartisan-web 带入的传递依赖（其自动配置类签名引用 Redis 类型，排除即炸），
    # 连接不存在时 Redis health indicator 会把 /actuator/health 恒拉成 DOWN，关之。
    redis:
      enabled: false
