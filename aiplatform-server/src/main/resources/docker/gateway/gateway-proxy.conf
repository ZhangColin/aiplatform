# 代理块（#128/#141 共享）：location / 反代到 server 块派生的 $upstream_host——
# 子域捕获与「子域 label → 容器名/网络别名」变换归各 server 块（主预览 ws-{id}、
# 快照 snap-{viewId} 别名），本块只管「怎么代理」（升级透传/超时/头），被各 profile
# 的 server {} 块 include（见 nginx.conf / nginx.prod.conf.template）。resolver 在
# http 层、由各配置文件各自声明，不在本块内。
location / {
    set $upstream http://$upstream_host:8081;
    proxy_pass $upstream;
    # WebSocket 升级透传（next dev 的 /_next/hmr 等）：nginx 默认剥 hop-by-hop 头
    # （Upgrade/Connection）且以 HTTP/1.0 转发——升级头到不了上游，/_next/hmr 被
    # next 当页面路由 404，浏览器侧 WebSocket connection failed 无限重试。官方范式
    # 是 map 变量（http 块、各 profile 自声明）：仅客户端真带 Upgrade 才置
    # Connection: upgrade，普通请求不受扰。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 升级成功后是隧道长连接：放宽空闲读超时（默认 60s 会掐静默期稍长的 WS）
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 原客户端 scheme（dev http / prod https）：下游应用据此生成绝对 URL、判外部协议
    proxy_set_header X-Forwarded-Proto $scheme;
    # 上游回未压缩 HTML：注入块（gateway-inject.conf）的 sub_filter 依赖（gzip 挡
    # 字符串替换）；对不 include 注入块的快照路由无实害——统一代理行为，单源不劈叉
    proxy_set_header Accept-Encoding "";
}
