# 共享路由/注入块（#128/#129）：dev 与 prod 同一份——被各 profile 的 server {} 块
# `include`（见 nginx.conf / nginx.prod.conf.template），改注入脚本或 annotation.js
# 路径只改这一处。resolver 在 http 层、由各配置文件各自声明，不在本块内。
#
# 标注脚本资产（平台产物，网关自持）：注入脚本引用的同源路径，不代理到用户容器
location = /.aiplatform/annotation.js {
    alias /etc/nginx/annotation.js;
    default_type application/javascript;
}

# 注入标注脚本：sub_filter 在 HTML 里把 </head> 替换为「脚本引用 + </head>」。
# Accept-Encoding 置空让上游回未压缩 HTML（gzip 会挡住 sub_filter 的字符串替换）。
sub_filter_once on;
sub_filter '</head>'
    '<script data-aiplatform="annotation" src="/.aiplatform/annotation.js"></script></head>';

location / {
    set $upstream http://ws-$wsid:8081;
    proxy_pass $upstream;
    # WebSocket 升级透传（next dev 的 /_next/hmr 等）：nginx 默认剥 hop-by-hop 头
    # （Upgrade/Connection）且以 HTTP/1.0 转发——升级头到不了上游，/_next/hmr 被
    # next 当页面路由 404，浏览器侧 WebSocket connection failed 无限重试。官方范式
    # 是 map 变量（http 块、各 profile 自声明）：仅客户端真带 Upgrade 才置
    # Connection: upgrade，普通请求不受扰。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 升级成功后是隧道长连接：放宽空闲读超时（默认 60s 会掐静默期稍长的 WS）
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 原客户端 scheme（dev http / prod https）：下游应用据此生成绝对 URL、判外部协议
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
}
