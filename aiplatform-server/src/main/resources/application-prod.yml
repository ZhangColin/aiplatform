spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

spring.jpa.show-sql: false
logging.level.root: INFO

# 预览网关（#129 生产化）：预览 URL 换 https + 生产基域名 {id}.preview.{domain}——
# 同一份 nginx 网关配置（nginx.prod.conf.template，TLS 终止 + wildcard 证书），见
# docs/guide/预览网关.md。PREVIEW_BASE 部署时供给（无默认，缺省启动即 fail-fast）。
app:
  embedding:
    url: ${EMBEDDING_URL}
  workspace:
    preview-scheme: https
    preview-base: ${PREVIEW_BASE}

# 生产 https：cookie 必须 Secure（A2 §2 表 8-②）；issuer/redirect-uri 随环境注册
sso:
  cookie-secure: true
