# 平台接入共享 nginx 的服务配置（#386）——安装为 infra 的 conf.d/aiplatform.conf，
# 唯一合法通道是门禁：./install-nginx-conf.sh aiplatform <本文件> "" <装配好的资产目录>
# （资产经 deploy/nginx/assemble-assets.sh 装配，门禁装入 conf.d/aiplatform.assets/）。
#
# 承载三块路由（与退役的预览网关/演示 conf 行为对齐）：
#   主站      semgravio.com / www.semgravio.com → aiplatform-web:3333（反代，SSE 不扣流）
#   主预览    {id}.preview.semgravio.com → ws-{id}:8081（注入块＋代理块，圈注可换）
#   快照      snap-{viewId}.preview.semgravio.com → snap-{viewId}:8081（仅代理块，只逛不换）
# 动态解析：previewnet 内 Docker DNS（ws-{id} 容器名 / snap-{viewId} 网络别名），零 per-app
# 配置零 reload（ADR-0014 口径不变）。
#
# http 层指令（resolver/map）在本文件声明——conf.d 在 infra nginx.conf 的 http 块内被
# include，语义同独立网关的 http 块。map 的 $connection_upgrade 变量全 nginx 唯一消费方
# 是本文件的代理块；后续接入服务需要同款升级透传时须复用该变量名（重复 map 同名变量
# 是 nginx 启动错误，由门禁 nginx -t 兜底拦下）。
#
# 契约约束（门禁强制）：不得声明 default_server（归 infra 兜底 server）；server_name
# 单行书写（撞车检测按单行抽取）；资产只引用自己名下 conf.d/aiplatform.assets/。

# Docker 内置 DNS：按容器名/别名解析（ws-{id}、snap-{viewId}）。valid=5s（#180）：
# 唤醒/重建换新容器 IP 后最迟 5s 重解析，消掉「上游已就绪、路由仍指旧 IP」的 502 窗口
resolver 127.0.0.11 valid=5s ipv6=off;

# WebSocket 升级透传配合变量（gateway-proxy.conf 消费）：硬编码 Connection "upgrade"
# 会污染全部普通请求，map 只在真带 Upgrade 头时置位
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# #394/#403 环境性阻断收口（ADR-0034）：Origin 按 URI 派生（gateway-proxy.conf 消费）
# ——Next 15.2+ dev 闸门护 /_next* 与 /__nextjs* 两族（#403 实测：/__nextjs_font*、
# /__nextjs_original-stack-frame* 带 Origin 全 403；字体按 CSS Fonts 规范 CORS 模式
# 加载必带 Origin，同源也带）。两族前缀置空＝网关剥 Origin 头，根除对带非白名单
# Origin 的资产 403（页面卡加载、字体 403、HMR 握手断）；其余路径原样透传（应用
# Origin 语义零扰动）。同 $connection_upgrade 口径：变量全 nginx 唯一消费方是本文件
# 的代理块，后续接入需要同款行为时复用变量名（重复 map 同名变量是 nginx 启动错误，
# 门禁 nginx -t 兜底拦下）
map $uri $preview_origin {
    ~^/_next/     "";
    ~^/__nextjs   "";
    default       $http_origin;
}

# 主站：SSE（/api/events 经 next 透传）不扣流；上传对齐后端 12MB 上限放宽到 20m。
# IP 直访/未匹配域名归 infra 兜底 server（契约不抢占 default_server）——域名访问行为
# 与退役网关一致（网关形态里 default_server 兜 IP 直访的口子随契约收口，见部署文档）
server {
    listen 80;
    server_name semgravio.com www.semgravio.com;
    client_max_body_size 20m;

    location / {
        set $upstream_web aiplatform-web;
        proxy_pass http://$upstream_web:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# 主预览：子域捕获 workspaceId（TSID 数值形）——{id}.preview.semgravio.com → ws-{id}:8081
server {
    listen 80;
    server_name ~^(?<wsid>[0-9]+)\.preview\.semgravio\.com$;
    set $upstream_host ws-$wsid;

    include /etc/nginx/conf.d/aiplatform.assets/gateway-inject.conf;
    include /etc/nginx/conf.d/aiplatform.assets/gateway-proxy.conf;
}

# 「查看当时」快照（#141）：snap-{viewId}.preview.semgravio.com → 别名 snap-{viewId}:8081
# （快照容器进 previewnet、--network-alias 与子域一一对应）。只逛不换：不 include 注入块
server {
    listen 80;
    server_name ~^snap-(?<vid>[0-9]+)\.preview\.semgravio\.com$;
    set $upstream_host snap-$vid;

    include /etc/nginx/conf.d/aiplatform.assets/gateway-proxy.conf;
}
