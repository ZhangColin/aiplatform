# 本机开发依赖（启动说明正本 docs/guide/本机依赖启动.md）。
# 平台 PG 用独立实例 5434：5432 是本机共享 aieducenter 库（无 vector 扩展），
# 5433 是冻结 demo 的库；本服务库表（prj_/ord_/wsp_/knw_/…）不与它们混放。
# 平台自身不用 Redis（会话内存态；沙箱容器的 pg/redis 在各工作区容器内，与此无关）。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aiplatform
      POSTGRES_USER: aiplatform
      POSTGRES_PASSWORD: aiplatform-dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
