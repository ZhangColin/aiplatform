<!DOCTYPE html>
<!-- 上游不可达提示页（#180 A 片）：预览网关对代理失败族（502/504，nginx 自产
     错误码）回的网关自持资产（同 annotation.js 自持先例，ADR-0014）——浅色预览
     舞台视觉的静态复刻：色板/排印与 aiplatform-web 浅色档单源同值
     （globals.css :root/.light-lock），不随平台 Dark 翻转。文案中性：网关无状态
     区分不了「启动中/休眠」，不承诺启动（ADR-0016：访客经网关不触发唤醒）。
     自恢复脚本（data-aiplatform="recovery"）同源轮询、上游恢复即整页重载。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>系统暂不可用</title>
<style>
  :root {
    --background: oklch(0.985 0.001 106);
    --foreground: oklch(0.216 0.006 56);
    --muted-foreground: oklch(0.553 0.012 56);
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background);
    color: var(--muted-foreground);
    font: 14px/1.75 Geist, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 舞台空态复刻（PanelHint 同构）：全高居中纵列、图标-正文 12px 间距 */
  .hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    text-align: center;
  }
  /* 检测指示（LoaderCircle 静态复刻）：页面的确在轮询检测，转圈是诚实反馈 */
  .spinner {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--muted-foreground);
    border-top-color: transparent;
    animation: spin 0.8s linear infinite;
  }
  .sub { font-size: 13px; }
  p { margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="hint">
    <div class="spinner" role="status" aria-label="正在检测系统状态"></div>
    <p>系统暂不可用，可能正在启动或休眠中</p>
    <p class="sub">请稍后重试，或联系项目所有者</p>
  </div>
  <script data-aiplatform="recovery">
  // 自恢复（#180 A 片）：以 ~2s 间隔同源轮询上游，得非 5xx（上游活了——应用自身
  // 的 4xx 也算活）即整页重载回真系统。只被动等待，不触发任何唤醒（网关侧无唤醒
  // 逻辑，ADR-0016）。fetch 网络层失败（网关自身不可达等）静默续轮，页面自愈。
  (function () {
    setInterval(function () {
      fetch("/", { cache: "no-store" })
        .then(function (res) { if (res.status < 500) location.reload(); })
        .catch(function () {});
    }, 2000);
  })();
  </script>
</body>
</html>
