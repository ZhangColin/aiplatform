# 平台预览网关（#128，dev profile）：通配 server 块把 *.localhost 子域路由到
# 对应工作区容器，零 per-app 配置、零 reload；resolver 指向 Docker 内置 DNS
# （127.0.0.11），按容器名解析。代理块（gateway-proxy.conf）与注入块
# （gateway-inject.conf，网关自持标注脚本、不进用户源码）单源、由各 server {} 块
# 按需 include——与生产同构（#129），只差 base 域名与 TLS。
#
# 快照路由（#141）：snap-{viewId}.localhost → 网络别名 snap-{viewId}:8081，只 include
# 代理块（快照「只逛不换」，不注入圈注——ADR 0007/0014 口径）。
#
# 生产同构（#129）：base 换 *.preview.{domain} + wildcard 证书（TLS 终止），代理/注入
# 块不变——见同目录 nginx.prod.conf.template。部署与开发启动见 docs/guide/（预览网关）
# 与 ADR-0014。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker 内置 DNS：网关按容器名/别名解析（ws-{id} 容器名、snap-{viewId} 快照别名）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # WebSocket 升级透传配合变量（gateway-proxy.conf 消费）：硬编码
    # Connection "upgrade" 会污染全部普通请求，map 只在真带 Upgrade 头时置位
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 主预览：子域捕获 workspaceId（TSID 数值形）——{id}.localhost → ws-{id}:8081
    server {
        listen 80;
        server_name ~^(?<wsid>[0-9]+)\.localhost$;
        set $upstream_host ws-$wsid;

        include gateway-inject.conf;
        include gateway-proxy.conf;
    }

    # 「查看当时」快照（#141）：snap-{viewId}.localhost → 别名 snap-{viewId}:8081
    # （快照容器进 previewnet、--network-alias 与子域一一对应，容器名仍带 ws-{id}-
    # 前缀供级联清理）。只逛不换：不 include 注入块。
    server {
        listen 80;
        server_name ~^snap-(?<vid>[0-9]+)\.localhost$;
        set $upstream_host snap-$vid;

        include gateway-proxy.conf;
    }
}
