# 平台预览网关（#128，dev profile）：一条通配 server 块把 *.localhost 子域路由到
# 对应工作区容器 ws-{id}:8081，零 per-app 配置、零 reload；resolver 指向 Docker 内置
# DNS（127.0.0.11），按容器名解析。路由/注入块（网关注入标注脚本 annotation.js，
# 网关自持、不进用户源码、不在容器内）单源在 gateway-route.conf，由 server {} 块
# include——与生产同构（#129），只差 base 域名与 TLS。
#
# 生产同构（#129）：base 换 *.preview.{domain} + wildcard 证书（TLS 终止），路由/注入
# 块不变——见同目录 nginx.prod.conf.template。部署与开发启动见 docs/guide/（预览网关）
# 与 ADR-0014。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Docker 内置 DNS：网关按容器名 ws-{id} 解析到工作区容器 IP（同网 previewnet）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # WebSocket 升级透传配合变量（gateway-route.conf 消费）：硬编码
    # Connection "upgrade" 会污染全部普通请求，map 只在真带 Upgrade 头时置位
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        # 子域捕获 workspaceId（TSID 数值形）——{id}.localhost → ws-{id}:8081
        server_name ~^(?<wsid>[0-9]+)\.localhost$;

        include gateway-route.conf;
    }
}
