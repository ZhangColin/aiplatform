# 注入块（#128/#137）：平台脚本资产 + 圈注/试用体验提示 HTML 注入，仅主预览
# server {} 块 include（ADR 0014 原口径；#539 试用提示不注入）。
#
# 资产路径统一按共享 nginx 挂载形态（#386：/etc/nginx/conf.d/aiplatform.assets/）——
# dev/独立网关容器把脚本挂到同一路径（docker 会为单文件 bind-mount 建父目录），
# 共享 nginx 则由门禁第四参把资产装入该名下目录；两边块文件零分叉。

# 圈注脚本资产（平台产物，网关自持）：注入脚本引用的同源路径，不代理到用户容器。
location = /.aiplatform/annotation.js {
    alias /etc/nginx/conf.d/aiplatform.assets/annotation.js;
    default_type application/javascript;
}

# 试用体验提示资产（#539 访谈④）：同圈注先例，网关自持、不进用户源码。
location = /.aiplatform/trial-notice.js {
    alias /etc/nginx/conf.d/aiplatform.assets/trial-notice.js;
    default_type application/javascript;
}

# 试用提示判定反代（#539）：脚本同源 fetch 本路径——零 CORS；X-Preview-Workspace
# 头由本 server 块的子域捕获 $wsid 注入（覆写客户端同名字头，workspaceId 以路由
# 为准）；上游 $platform_api 由各消费方 server 块派生（dev host.docker.internal:8888
# / 生产 aiplatform-server:8888——同 $upstream_host 单源先例，块文件零分叉）。
# proxy_pass 不带 URI＝原路径透传（后端端点同路径注册）。响应是 JSON——text/html
# 过滤的 sub_filter 天然不命中；上游缺席如实 502（代理块 error_page 提示页口径）。
location = /.aiplatform/trial-notice {
    proxy_pass http://$platform_api;
    proxy_set_header X-Preview-Workspace $wsid;
}

# 注入平台脚本：sub_filter 在 HTML 里把 </head> 替换为「脚本引用 + </head>」
# （圈注 + 试用体验提示并列注入 #539——单规则双标签、一次替换恰一次）。
sub_filter_once on;
sub_filter '</head>' '<script data-aiplatform="annotation" src="/.aiplatform/annotation.js"></script><script data-aiplatform="trial-notice" src="/.aiplatform/trial-notice.js"></script></head>';
