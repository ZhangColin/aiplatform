# semgravio-infra nginx 主体（infra 管辖，接入服务不要改这里）。
# 服务配置一律走 conf.d/<service>.conf（经门禁脚本安装，见 ../README.md）。
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    # 接入服务配置入口：门禁装进来的 <service>.conf 在这里生效
    include /etc/nginx/conf.d/*.conf;

    # 兜底 server（IP 直访/未匹配域名）：default_server 归 infra，服务 conf 不得再声明
    # （门禁会拒）。/healthz 同时是容器健康检查位——保持 200 无日志。
    server {
        listen      80 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 "semgravio-infra\n"; }
        location / { return 404; }
    }
}
