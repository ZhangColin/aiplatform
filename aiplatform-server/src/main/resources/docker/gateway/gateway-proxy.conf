# 代理块（#128/#141 共享，#180 A 片扩）：location / 反代到 server 块派生的
# $upstream_host——子域捕获与「子域 label → 容器名/网络别名」变换归各 server 块
# （主预览 ws-{id}、快照 snap-{viewId} 别名），本块只管「怎么代理」（升级透传/
# 超时/头）与「代理失败的呈现」（上游不可达自恢复提示页），被各消费方的
# server {} 块 include——dev 预览网关（同目录 nginx.conf）、平台接入共享 nginx 的
# conf.d 配置（deploy/nginx/aiplatform.conf，#386）一并生效。resolver 在 http 层、
# 由各消费方配置各自声明，不在本块内。
#
# 上游不可达（#180 A 片）：代理失败族（502 连不上/DNS 解析失败、504 超时——均为
# nginx 自产错误码）内部重定向到网关自持的提示页，替代裸 502；error_page 不带
# 「=」保留原状态码（口径：状态码仍 5xx，页面只是换脸）。不开 proxy_intercept_
# errors：上游应用自己回的 4xx/5xx 原样透传——提示页只管「网关连不上上游」，
# 不覆盖应用自身错误。网关侧零唤醒逻辑（ADR-0016：访客经网关不触发）。
error_page 502 504 /.aiplatform/unavailable.html;

# 提示页资产（网关自持，同 annotation.js 先例）：internal——只经 error_page 内部
# 重定向可达，直访 404。Cache-Control no-store 须 always：add_header 默认只加在
# 2xx/3xx，5xx 状态码下会丢。
location = /.aiplatform/unavailable.html {
    internal;
    # 资产路径同 annotation.js：统一按共享 nginx 挂载形态（/etc/nginx/conf.d/aiplatform.assets/，
    # 见 gateway-inject.conf 头注），dev/独立网关容器挂到同一路径
    alias /etc/nginx/conf.d/aiplatform.assets/unavailable.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    # 覆写注入块的 sub_filter 为永不命中模式（array 型指令：本层声明即不继承
    # server 层清单）：提示页是平台页面、不是用户系统，不注入圈注脚本——nginx
    # 自产错误页与上游 HTML 一样过 text/html 过滤链，不覆写就会注入。
    # 快照 server 块不 include 注入块，此覆写对其无实义、仅为单源不劈叉。
    sub_filter '__aiplatform_error_page_never_matches__' '';
}

location / {
    set $upstream http://$upstream_host:8081;
    proxy_pass $upstream;
    # WebSocket 升级透传（next dev 的 /_next/hmr 等）：nginx 默认剥 hop-by-hop 头
    # （Upgrade/Connection）且以 HTTP/1.0 转发——升级头到不了上游，/_next/hmr 被
    # next 当页面路由 404，浏览器侧 WebSocket connection failed 无限重试。官方范式
    # 是 map 变量（http 块、各 profile 自声明）：仅客户端真带 Upgrade 才置
    # Connection: upgrade，普通请求不受扰。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 升级成功后是隧道长连接：放宽空闲读超时（默认 60s 会掐静默期稍长的 WS）
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 原客户端 scheme（dev http / prod https）：下游应用据此生成绝对 URL、判外部协议
    proxy_set_header X-Forwarded-Proto $scheme;
    # #394 环境性阻断收口（ADR-0034）：Origin 按 URI 派生——/_next/ 前缀置空（nginx
    # 空值语义＝整头不下传）根除 Next 15.2+ dev 服务器跨源闸门（带非白名单 Origin 的
    # /_next/ 资产一律 403，crossorigin/module chunk 与 HMR 握手由此恢复）；其余路径
    # 原样透传（$http_origin）——Server Actions CSRF 校验、AI 自写 Origin 校验零扰动。
    # 变量由各消费方在 http 层 map 声明（按 $uri 派生，同 $connection_upgrade 先例：
    # 块文件被 include 进 server{}，map 只能在 http 层）。写法可换（如新 location 复制
    # 指令组），语义以冒烟断言为准——须避开 proxy_set_header 继承陷阱（location 级一旦
    # 声明即不继承外层），故不走「/_next/ 单独 location」而在此单点派生
    proxy_set_header Origin $preview_origin;
    # 上游回未压缩 HTML：注入块（gateway-inject.conf）的 sub_filter 依赖（gzip 挡
    # 字符串替换）；对不 include 注入块的快照路由无实害——统一代理行为，单源不劈叉
    proxy_set_header Accept-Encoding "";
    # #394 响应侧收口：剥上游的 X-Frame-Options——iframe 嵌入是平台选择的展示方式，
    # 安全中间件默认 XFO 属环境性阻断（ADR-0034 判据：换个普通 app 放预览通道也会被
    # 挡＝平台兜）。CSP 整头不剥（frame-ancestors 记已知开口）；主站路由不经本块不受扰
    proxy_hide_header X-Frame-Options;
}
