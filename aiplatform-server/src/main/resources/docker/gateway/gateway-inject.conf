# 注入块（#128/#137）：平台脚本资产 + 圈注 HTML 注入，仅主预览
# server {} 块 include（ADR 0014 原口径。#539 试用体验提示已随 2026-11-26
# 用户指示拆除——演示场合横幅影响效果；注入面回归圈注单脚本，判定端点反代
# 与 $platform_api 派生一并退场）。
#
# 资产路径统一按共享 nginx 挂载形态（#386：/etc/nginx/conf.d/aiplatform.assets/）——
# dev/独立网关容器把脚本挂到同一路径（docker 会为单文件 bind-mount 建父目录），
# 共享 nginx 则由门禁第四参把资产装入该名下目录；两边块文件零分叉。

# 圈注脚本资产（平台产物，网关自持）：注入脚本引用的同源路径，不代理到用户容器。
location = /.aiplatform/annotation.js {
    alias /etc/nginx/conf.d/aiplatform.assets/annotation.js;
    default_type application/javascript;
}

# 注入平台脚本：sub_filter 在 HTML 里把 </head> 替换为「脚本引用 + </head>」
# （一次替换恰一次；#539 的双标签形态已随试用提示拆除回归单标签）。
sub_filter_once on;
sub_filter '</head>' '<script data-aiplatform="annotation" src="/.aiplatform/annotation.js"></script></head>';
