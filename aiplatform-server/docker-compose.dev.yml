# 本机开发依赖（PG 正口径＝本机 5432 单实例，见 docs/guide/本地开发启动.md §2；
# 下面 5434 docker PG 仅作 5432 不可用时的应急备胎，平时勿起——起了也不被任何
# 配置引用）。
# 平台自身不用 Redis（会话内存态；沙箱容器的 pg/redis 在各工作区容器内，与此无关）。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aiplatform
      POSTGRES_USER: aiplatform
      POSTGRES_PASSWORD: aiplatform-dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
